[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp", "crates/install", "crates/setup", "crates/dev-server", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
headway-core = { path = "crates/core" }
headway-mcp = { path = "crates/mcp" }
headway-install = { path = "crates/install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "io-std"] }
# native-tls = Windows' own TLS (SChannel): no extra C toolchain needed to build.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "gzip"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "7"

# Small, fast release binaries (from the Tauri size guide).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
