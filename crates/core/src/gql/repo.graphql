query Repo($owner: String!, $name: String!, $since: GitTimestamp!) {
  repository(owner: $owner, name: $name) {
    id
    nameWithOwner
    name
    description
    url
    homepageUrl
    isPrivate
    isArchived
    hasIssuesEnabled
    createdAt
    pushedAt
    owner { login avatarUrl }
    stargazerCount
    forkCount
    viewerPermission
    primaryLanguage { name color }
    defaultBranchRef {
      name
      target {
        ... on Commit {
          history(first: 1) {
            totalCount
            nodes {
              oid
              messageHeadline
              committedDate
              url
              author { name user { login avatarUrl } }
            }
          }
          recent: history(first: 100, since: $since) {
            totalCount
            pageInfo { hasNextPage endCursor }
            nodes { committedDate author { name user { login } } }
          }
        }
      }
    }
    openIssues: issues(states: OPEN) { totalCount }
    closedIssues: issues(states: CLOSED) { totalCount }
    openPulls: pullRequests(states: OPEN) { totalCount }
    mergedPulls: pullRequests(states: MERGED) { totalCount }
    closedPulls: pullRequests(states: CLOSED) { totalCount }
    branches: refs(refPrefix: "refs/heads/") { totalCount }
  }
}
