[package]
name = "headway-install"
description = "Installing and removing Headway on Windows: files, shortcuts, the Installed apps entry"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
thiserror.workspace = true
winreg = "0.56"
mslnk = "0.1.8"

[target.'cfg(windows)'.dependencies]
# Finding and ending the copies of Headway that still run when it is uninstalled.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
