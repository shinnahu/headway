<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" fill="none">
  <!-- The picture on the setup window: Headway's own screens in miniature
       (project health in the back, the branch explorer in front). No text. -->
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#161428" flood-opacity="0.13"/>
    </filter>
    <filter id="lift-sm" x="-30%" y="-40%" width="160%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#161428" flood-opacity="0.14"/>
    </filter>
    <pattern id="strong" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#0a84ff"/>
      <rect width="2.6" height="7" fill="#fff" opacity="0.22"/>
    </pattern>
    <pattern id="light" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#cfe4fd"/>
      <rect width="2.6" height="7" fill="#fff" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- back card: project health -->
  <g filter="url(#lift)">
    <rect x="12" y="8" width="226" height="146" rx="18" fill="#fff"/>
  </g>
  <rect x="12.500" y="8.500" width="225" height="145" rx="17.500" stroke="#ecebf1"/>
  <rect x="28" y="24" width="20" height="20" rx="7" fill="#edf5ff"/>
  <path d="M33.500 34.500l3 3 6-6.500" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="30" width="58" height="8" rx="4" fill="#ecebf1"/>
  <circle cx="58" cy="98" r="24" stroke="#d9ecff" stroke-width="7"/>
  <circle cx="58" cy="98" r="24" stroke="#0a84ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="111.600 150.800" transform="rotate(-90 58 98)"/>
  <rect x="50" y="94" width="16" height="8" rx="4" fill="#dfdde7"/>
  <rect x="104" y="108" width="11" height="24" rx="5.500" fill="url(#light)"/>
  <rect x="121" y="92" width="11" height="40" rx="5.500" fill="url(#light)"/>
  <rect x="138" y="100" width="11" height="32" rx="5.500" fill="url(#light)"/>
  <rect x="155" y="78" width="11" height="54" rx="5.500" fill="url(#strong)"/>
  <rect x="172" y="86" width="11" height="46" rx="5.500" fill="url(#strong)"/>
  <rect x="189" y="64" width="11" height="68" rx="5.500" fill="url(#strong)"/>
  <rect x="206" y="72" width="11" height="60" rx="5.500" fill="url(#strong)"/>

  <!-- a status pill floating off the corner -->
  <g filter="url(#lift-sm)">
    <rect x="204" y="22" width="84" height="30" rx="15" fill="#fff"/>
  </g>
  <circle cx="221" cy="37" r="8" fill="#e4f6eb"/>
  <path d="M217.500 37.200l2.400 2.400 4.600-5" stroke="#1a9f53" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="235" y="33" width="40" height="8" rx="4" fill="#ecebf1"/>

  <!-- front card: branches -->
  <g filter="url(#lift)">
    <rect x="60" y="128" width="228" height="112" rx="18" fill="#fff"/>
  </g>
  <rect x="60.500" y="128.500" width="227" height="111" rx="17.500" stroke="#ecebf1"/>
  <rect x="76" y="148" width="196" height="24" rx="12" fill="#edf5ff" stroke="#d9ecff"/>
  <rect x="134" y="194" width="84" height="24" rx="12" fill="#f5f4f8" stroke="#dfdde7"/>
  <path d="M126 160C140 160 136 206 150 206" stroke="#b9b8c4" stroke-width="1.600"/>
  <path d="M202 206C218 206 206 160 217 160" stroke="#1a9f53" stroke-width="1.900"/>
  <path d="M219 160l-7.500-4.300v8.600z" fill="#1a9f53"/>
  <path d="M90 160H258" stroke="#0a84ff" stroke-width="2"/>
  <path d="M150 206H202" stroke="#6f7889" stroke-width="2"/>
  <g fill="#fff" stroke="#0a84ff" stroke-width="2.200">
    <circle cx="90" cy="160" r="5.500"/>
    <circle cx="126" cy="160" r="5.500"/>
    <circle cx="172" cy="160" r="5.500"/>
    <circle cx="226" cy="160" r="5.500"/>
  </g>
  <circle cx="258" cy="160" r="9" fill="#0a84ff" opacity="0.2"/>
  <circle cx="258" cy="160" r="5.500" fill="#0a84ff" stroke="#0a84ff" stroke-width="2.200"/>
  <circle cx="258" cy="160" r="2.200" fill="#fff"/>
  <g fill="#fff" stroke="#6f7889" stroke-width="2.200">
    <circle cx="150" cy="206" r="5.500"/>
    <circle cx="176" cy="206" r="5.500"/>
    <circle cx="202" cy="206" r="5.500"/>
  </g>
</svg>
